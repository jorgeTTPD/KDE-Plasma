[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
primary = #89b4fa
disabled = #6c7086
red = #f38ba8
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
sky = #89dceb
sapphire = #74c7ec
overlay = #9399b2
surface = #45475a

[bar/mi_barra]
width = 98%
offset-x = 1%
offset-y = 6
height = 28
radius = 10
border-size = 1
border-color = ${colors.background-alt}
override-redirect = true
wm-restack = bspwm
pseudo-transparency = false
background = #99000000
foreground = ${colors.foreground}
padding-left = 0.5
padding-right = 0.5
module-margin = 0.8

font-0 = "JetBrainsMono Nerd Font:size=10;3"
font-1 = "JetBrainsMono Nerd Font:size=14;3"
font-2 = "JetBrainsMono Nerd Font:size=3;3"

modules-left = arch checkupdates sep xworkspaces sep launcher-btop launcher-files launcher-pipe launcher-git launcher-nvim launcher-fresh
modules-center = soundbar music-scroll
modules-right = cpu  memory  temperature space  network space space battery space space pulseaudio space brightness  date  powermenu


cursor-click = pointer
enable-ipc = true


# Modulos extraidos: ver modules.ini
include-file = /home/jorge/.config/polybar/modules.ini
